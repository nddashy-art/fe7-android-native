name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out FE7 US source (source only; no ROM/assets)
        uses: actions/checkout@v4
        with:
          repository: StanHash/fe7_us
          ref: 5c8b3c5e254e00f0f3458b9772c27e1a5a326e3b
          path: fe7_us-main

      - name: Prepare FE7 source compatibility layer
        run: python3 scripts/prepare_fe7_native_source.py "$GITHUB_WORKSPACE/fe7_us-main"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test portable C++ GBA-header parser
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I app/src/main/cpp tools/test_gba_header_parser.cpp -o /tmp/fe7-gba-header-test
          /tmp/fe7-gba-header-test

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018

      - name: Build pinned mGBA core for Android ABIs
        run: bash tools/build_mgba_android.sh

      - name: Build debug APK with the FE7 source slice enabled
        run: gradle --no-daemon :app:assembleDebug "-Pfe7SourceRoot=$GITHUB_WORKSPACE/fe7_us-main"

      - name: Audit FE7 engine object symbols and relocations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FE7_OBJECTS < <(find app/.cxx -type f -name '*.o' | grep -E '/CMakeFiles/fe7_engine_(seed|startup_probe|service_probe|m4a_probe|asm_probe)\.dir/' | sort)
          if [ "${#FE7_OBJECTS[@]}" -eq 0 ]; then
            echo "No FE7 compile-probe objects found in app/.cxx" >&2
            find app/.cxx -maxdepth 5 -type d | head -80 || true
            exit 1
          fi
          LLVM_NM="$(find "$ANDROID_HOME/ndk" -path '*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm' -print -quit)"
          if [ -z "$LLVM_NM" ]; then
            echo "Could not locate NDK llvm-nm" >&2
            exit 1
          fi
          python3 scripts/audit_fe7_native_objects.py \
            --nm "$LLVM_NM" \
            --readelf "${LLVM_NM%llvm-nm}llvm-readelf" \
            --output "$RUNNER_TEMP/fe7-native-link-audit.txt" \
            "${FE7_OBJECTS[@]}"
          cat "$RUNNER_TEMP/fe7-native-link-audit.txt"

      - name: Attempt real FE7 engine shared-library link (diagnostic)
        shell: bash
        run: |
          set -u
          REPORT="$RUNNER_TEMP/fe7-native-link-attempt.txt"
          : > "$REPORT"
          NDK_ROOT="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          TOOLBIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for ABI in arm64-v8a armeabi-v7a; do
            case "$ABI" in
              arm64-v8a) COMPILER="$TOOLBIN/aarch64-linux-android24-clang++" ;;
              armeabi-v7a) COMPILER="$TOOLBIN/armv7a-linux-androideabi24-clang++" ;;
            esac
            mapfile -t OBJECTS < <(find app/.cxx -type f -name '*.o' | grep "/$ABI/CMakeFiles/\(fe7_engine_\(seed\|startup_probe\|service_probe\|m4a_probe\|asm_probe\)\|fe7runtime\)\.dir/" | sort)
            {
              echo "## $ABI"
              echo "Objects found: ${#OBJECTS[@]}"
            } >> "$REPORT"
            if [ "${#OBJECTS[@]}" -eq 0 ]; then
              echo "No objects found for $ABI; skipping." >> "$REPORT"
              continue
            fi
            set +e
            "$COMPILER" -shared -Wl,--no-undefined -Wl,--fatal-warnings \
              -o "$RUNNER_TEMP/libfe7engine-link-probe-$ABI.so" "${OBJECTS[@]}" \
              > "$RUNNER_TEMP/link-$ABI.stdout" 2> "$RUNNER_TEMP/link-$ABI.stderr"
            RESULT=$?
            set -e
            {
              echo "Link exit code: $RESULT"
              echo "--- linker diagnostics ---"
              cat "$RUNNER_TEMP/link-$ABI.stderr"
              echo "--- stdout ---"
              cat "$RUNNER_TEMP/link-$ABI.stdout"
              echo
            } >> "$REPORT"
          done
          cat "$REPORT"
          # The candidate link is diagnostic and must not prevent the known-good
          # mGBA-backed prototype APK from being produced.
          test -s "$REPORT"

      - name: Upload FE7 native link attempt
        uses: actions/upload-artifact@v4
        with:
          name: fe7-native-link-attempt
          path: ${{ runner.temp }}/fe7-native-link-attempt.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload FE7 native link audit
        uses: actions/upload-artifact@v4
        with:
          name: fe7-native-link-audit
          path: ${{ runner.temp }}/fe7-native-link-audit.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: fe7-android-native-prototype-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
