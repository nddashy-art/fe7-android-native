name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Test portable C++ GBA-header parser
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I app/src/main/cpp tools/test_gba_header_parser.cpp -o /tmp/fe7-gba-header-test
          /tmp/fe7-gba-header-test

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: fe7-android-native-prototype-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
